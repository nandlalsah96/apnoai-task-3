```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nandlal Sah — ApnoAI Task 2</title>

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      margin: 0;
    }

    .glass {
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .glass-dark {
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">

    const { useState } = React;

    // ============================================
    // PROFILE CARD COMPONENT
    // ============================================

    function ProfileCard({
      name,
      role,
      bio,
      skills,
      avatar,
      github,
      linkedin,
      portfolio
    }) {

      // Dark / Light mode
      const [isDark, setIsDark] = useState(false);

      // Connect button
      const [isConnected, setIsConnected] = useState(false);

      // Like counter
      const [likes, setLikes] = useState(0);

      // Toggle theme
      const toggleTheme = () => {
        setIsDark(!isDark);
      };

      // Toggle connection
      const toggleConnect = () => {
        setIsConnected(!isConnected);
      };

      // Like
      const handleLike = () => {
        setLikes(likes + 1);
      };

      return (

        <div
          className={`
            ${isDark
              ? "bg-gray-950"
              : "bg-gradient-to-br from-purple-600 via-pink-500 to-orange-400"
            }
            min-h-screen w-full flex items-center justify-center
            p-4 transition-all duration-500
          `}
        >

          {/* Theme Button */}
          <button
            onClick={toggleTheme}
            className="
              fixed top-5 right-5
              p-3 rounded-full glass
              hover:scale-110
              transition-transform
              z-10 shadow-lg
            "
            title={isDark ? "Switch to Light Mode" : "Switch to Dark Mode"}
          >
            {isDark ? "☀️" : "🌙"}
          </button>


          {/* Main Profile Card */}
          <div
            className={`
              ${isDark ? "glass-dark" : "glass"}
              rounded-3xl
              p-8
              max-w-md
              w-full
              shadow-2xl
              transition-all duration-500
            `}
          >

            {/* Avatar */}
            <div className="flex justify-center mb-6">

              <img
                src={avatar}
                alt={name}
                className="
                  w-32 h-32
                  rounded-full
                  object-cover
                  border-4
                  border-white/40
                  shadow-xl
                "
              />

            </div>


            {/* Name & Role */}
            <div className="text-center mb-6">

              <h1
                className={`
                  text-3xl
                  font-bold
                  mb-2
                  ${isDark ? "text-white" : "text-gray-900"}
                `}
              >
                {name}
              </h1>

              <p
                className={`
                  text-lg
                  font-medium
                  ${isDark ? "text-gray-300" : "text-gray-800"}
                `}
              >
                {role}
              </p>

            </div>


            {/* Bio */}
            <p
              className={`
                text-center
                mb-6
                leading-relaxed
                ${isDark ? "text-gray-300" : "text-gray-800"}
              `}
            >
              {bio}
            </p>


            {/* Skills */}
            <div className="flex flex-wrap gap-2 justify-center mb-6">

              {skills.map((skill, index) => (

                <span
                  key={index}
                  className={`
                    px-3 py-1
                    rounded-full
                    text-sm
                    font-medium
                    ${
                      isDark
                        ? "bg-white/10 text-white border border-white/20"
                        : "bg-white/50 text-gray-900 border border-white/30"
                    }
                  `}
                >
                  {skill}
                </span>

              ))}

            </div>


            {/* Connect Button */}
            <button
              onClick={toggleConnect}
              className={`
                w-full
                py-3
                rounded-xl
                font-semibold
                mb-3
                transition-all
                ${
                  isConnected
                    ? "bg-green-500 text-white hover:bg-green-600"
                    : isDark
                      ? "bg-white text-gray-900 hover:bg-gray-100"
                      : "bg-gray-900 text-white hover:bg-gray-800"
                }
              `}
            >
              {isConnected ? "✓ Connected" : "Connect"}
            </button>


            {/* Like Button */}
            <button
              onClick={handleLike}
              className={`
                w-full
                py-3
                rounded-xl
                font-semibold
                mb-6
                transition-all
                hover:scale-[1.02]
                ${
                  isDark
                    ? "bg-pink-500/20 text-pink-300 border border-pink-400/30"
                    : "bg-white/50 text-gray-900 border border-white/40"
                }
              `}
            >
              ❤️ Like {likes}
            </button>


            {/* Social Links */}
            <div className="flex justify-center gap-4">

              {/* GitHub */}
              <a
                href={github}
                target="_blank"
                rel="noopener noreferrer"
                title="GitHub"
                className={`
                  p-3
                  rounded-full
                  transition-transform
                  hover:scale-110
                  ${
                    isDark
                      ? "bg-white/10 text-white"
                      : "bg-white/50 text-gray-900"
                  }
                `}
              >

                <svg
                  className="w-5 h-5"
                  fill="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                </svg>

              </a>


              {/* LinkedIn */}
              <a
                href={linkedin}
                target="_blank"
                rel="noopener noreferrer"
                title="LinkedIn"
                className={`
                  p-3
                  rounded-full
                  transition-transform
                  hover:scale-110
                  ${
                    isDark
                      ? "bg-white/10 text-white"
                      : "bg-white/50 text-gray-900"
                  }
                `}
              >

                <svg
                  className="w-5 h-5"
                  fill="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                </svg>

              </a>


              {/* Portfolio */}
              <a
                href={portfolio}
                target="_blank"
                rel="noopener noreferrer"
                title="Portfolio"
                className={`
                  p-3
                  rounded-full
                  transition-transform
                  hover:scale-110
                  ${
                    isDark
                      ? "bg-white/10 text-white"
                      : "bg-white/50 text-gray-900"
                  }
                `}
              >
                🌐
              </a>

            </div>


            {/* Projects */}
            <div className="mt-6">

              <p
                className={`
                  text-center
                  text-sm
                  font-semibold
                  mb-3
                  ${isDark ? "text-gray-300" : "text-gray-700"}
                `}
              >
                🚀 Projects & Interests
              </p>


              <div className="flex flex-wrap justify-center gap-2">

                <span className="
                  px-3 py-1
                  rounded-full
                  text-xs
                  bg-blue-500/20
                  text-blue-600
                  border border-blue-400/30
                ">
                  JanSetuAI
                </span>

                <span className="
                  px-3 py-1
                  rounded-full
                  text-xs
                  bg-green-500/20
                  text-green-600
                  border border-green-400/30
                ">
                  FreshBite
                </span>

                <span className="
                  px-3 py-1
                  rounded-full
                  text-xs
                  bg-purple-500/20
                  text-purple-600
                  border border-purple-400/30
                ">
                  CampusConnect
                </span>

                <span className="
                  px-3 py-1
                  rounded-full
                  text-xs
                  bg-orange-500/20
                  text-orange-600
                  border border-orange-400/30
                ">
                  SahX
                </span>

              </div>

            </div>


            {/* Footer */}
            <div
              className="
                mt-6
                pt-6
                border-t
                border-white/20
                text-center
              "
            >

              <p
                className={`
                  text-xs
                  ${isDark ? "text-gray-400" : "text-gray-700"}
                `}
              >
                Built with React 18 + Tailwind CSS
              </p>

              <p
                className={`
                  text-xs
                  mt-1
                  ${isDark ? "text-gray-500" : "text-gray-600"}
                `}
              >
                ApnoAI Internship — Task 2
              </p>

            </div>

          </div>

        </div>
      );
    }


    // ============================================
    // YOUR PERSONAL DATA
    // ============================================

    ReactDOM.createRoot(
      document.getElementById("root")
    ).render(

      <ProfileCard

        name="Nandlal Sah"

        role="CSE Student | Full-Stack Developer | AI Enthusiast"

        bio="CSE student passionate about building modern web applications and AI-powered solutions. I enjoy turning real-world ideas into practical, user-friendly digital experiences while continuously learning new technologies."

        skills={[
          "React",
          "JavaScript",
          "Python",
          "Node.js",
          "MongoDB",
          "SQL",
          "AI/ML"
        ]}

        avatar="nandlal.jpeg"

        github="https://github.com/nandlalsah96"

        linkedin="https://www.linkedin.com/in/nandlal-sah/"

        portfolio="https://nandlal-seven.vercel.app/"

      />

    );

  </script>

</body>
</html>
```
